<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나이키 안산고잔 카탈로그</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6600">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
        body { background-color: #121212; color: #e0e0e0; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 24px; color: #ffffff; margin-bottom: 15px; }
        
        .categories { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .cat-btn { flex: 1; padding: 12px; background: #1e1e1e; border: 1px solid #333; color: #bbb; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; }
        .cat-btn.active { background: #ff6600; color: #fff; border-color: #ff6600; }

        .search-box { margin-bottom: 15px; }
        .search-box input { width: 100%; padding: 12px 15px; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 15px; }
        .search-box input:focus { outline: none; border-color: #ff6600; }

        .refresh-btn { width: 100%; padding: 12px; background: #1e1e1e; border: 1px solid #333; color: #888; border-radius: 8px; margin-bottom: 20px; cursor: pointer; font-size: 14px; }
        .refresh-btn:hover { background: #2a2a2a; color: #fff; }

        .product-list { display: flex; flex-direction: column; gap: 20px; }
        .product-card { background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .product-title { font-size: 18px; font-weight: bold; color: #ff8833; margin-bottom: 8px; }
        .product-code { font-size: 14px; color: #aaa; margin-bottom: 12px; }
        .product-price { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 12px; }
        
        .image-container { width: 100%; height: 220px; background: #222; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 15px; color: #666; font-size: 14px; }
        .image-container img { width: 100%; height: 100%; object-fit: cover; }

        .section-title { font-size: 13px; font-weight: bold; color: #ffaa66; margin-top: 10px; margin-bottom: 4px; text-transform: uppercase; }
        .product-usp, .product-sales { font-size: 14px; color: #ccc; line-height: 1.5; margin-bottom: 8px; background: #222; padding: 10px; border-radius: 6px; }

        .loading, .error { text-align: center; padding: 40px; color: #888; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <h1>나이키 안산고잔 카탈로그</h1>
    </header>

    <div class="categories">
        <div class="cat-btn active" onclick="filterCategory('전체', this)">전체</div>
        <div class="cat-btn" onclick="filterCategory('신발', this)">신발</div>
        <div class="cat-btn" onclick="filterCategory('의류', this)">의류</div>
        <div class="cat-btn" onclick="filterCategory('용품', this)">용품</div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 품번 또는 상품명을 입력하세요" oninput="searchProducts()">
    </div>

    <button class="refresh-btn" onclick="loadSheetData()">🔄 최신 데이터 불러오기</button>

    <div id="productContainer" class="product-list">
        <div class="loading">데이터를 불러오는 중입니다...</div>
    </div>

    <script>
        // ★ 중요: 여기에 아까 복사하신 구글 Apps Script 웹 앱 URL을 넣으세요!
        const SCRIPT_URL = "여기에_구글_Apps_Script_웹앱_URL을_입력하세요";

        let allData = [];
        let currentCategory = '전체';

        async function loadSheetData() {
            const container = document.getElementById('productContainer');
            container.innerHTML = '<div class="loading">데이터를 불러오는 중입니다...</div>';

            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                allData = data;
                displayProducts(allData);
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                container.innerHTML = '<div class="error">데이터를 불러오는 데 실패했습니다. Apps Script URL을 확인해주세요.</div>';
            }
        }

        function displayProducts(items) {
            const container = document.getElementById('productContainer');
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="error">표시할 상품이 없습니다.</div>';
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="product-card">
                    <div class="product-title">${item['제품명'] || '상품명 없음'}</div>
                    <div class="product-code">품번: ${item['품번'] || '-'} | 카테고리: ${item['카테고리'] || '-'}</div>
                    <div class="product-price">가격: ${item['가격'] ? Number(item['가격']).toLocaleString() + '원' : '가격 미정'}</div>
                    
                    <div class="image-container">
                        ${item['제품사진'] ? `<img src="${item['제품사진']}" alt="${item['제품명']}" onerror="this.parentElement.innerHTML='이미지 로드 실패'">` : '사진 준비 중'}
                    </div>

                    <div class="section-title">핵심 스펙 (USP)</div>
                    <div class="product-usp">${item['핵심스펙_USP'] || '등록된 스펙이 없습니다.'}</div>

                    <div class="section-title">세일즈 멘트</div>
                    <div class="product-sales">${item['세일즈멘트'] || '등록된 세일즈 멘트가 없습니다.'}</div>
                </div>
            `).join('');
        }

        function filterCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            applyFilter();
        }

        function searchProducts() {
            applyFilter();
        }

        function applyFilter() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = allData.filter(item => {
                const category = String(item['카테고리'] || '').trim();
                const name = String(item['제품명'] || '').toLowerCase();
                const code = String(item['품번'] || '').toLowerCase();

                const matchesCategory = (currentCategory === '전체' || category === currentCategory);
                const matchesKeyword = (name.includes(keyword) || code.includes(keyword));

                return matchesCategory && matchesKeyword;
            });

            displayProducts(filtered);
        }

        // 페이지 로드 시 데이터 가져오기 실행
        window.onload = function() {
            loadSheetData();
        };
    </script>
</body>
</html>

</body>
</html>
