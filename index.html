<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나이키 안산고잔 카탈로그</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
        body { background-color: #121212; color: #e0e0e0; padding: 20px; padding-bottom: 50px; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 22px; color: #ffffff; margin-bottom: 15px; }
        
        /* 탭 메뉴 (전체 제외, 신발 / 의류 / 기술) */
        .categories { display: flex; gap: 8px; margin-bottom: 15px; }
        .cat-btn { flex: 1; padding: 12px 6px; background: #1e1e1e; border: 1px solid #333; color: #bbb; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; white-space: nowrap; }
        .cat-btn.active { background: #ff6600; color: #fff; border-color: #ff6600; }

        /* 상단 액션바 (등록 버튼만 깔끔하게) */
        .action-bar { margin-bottom: 15px; }
        .action-btn { width: 100%; padding: 12px; background: #1e1e1e; border: 1px solid #333; color: #ff8833; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; }
        
        .search-box { margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 12px 15px; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 15px; }
        .search-box input:focus { outline: none; border-color: #ff6600; }

        /* 등록 폼 모달 창 */
        #formModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; width: 100%; max-width: 500px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { color: #ff8833; margin-bottom: 15px; font-size: 18px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; background: #222; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 14px; }
        .form-group textarea { height: 80px; resize: vertical; }
        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }

        /* 카드 UI 스타일 */
        .product-list { display: flex; flex-direction: column; gap: 20px; }
        .product-card { background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .product-title { font-size: 18px; font-weight: bold; color: #ff8833; margin-bottom: 8px; }
        .product-code { font-size: 14px; color: #aaa; margin-bottom: 12px; }
        .product-price { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 12px; }
        
        .image-container { width: 100%; height: 220px; background: #222; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 15px; color: #666; font-size: 14px; }
        .image-container img { width: 100%; height: 100%; object-fit: cover; }

        .section-title { font-size: 13px; font-weight: bold; color: #ffaa66; margin-top: 10px; margin-bottom: 4px; text-transform: uppercase; }
        .product-usp, .product-sales { font-size: 14px; color: #ccc; line-height: 1.5; margin-bottom: 8px; background: #222; padding: 10px; border-radius: 6px; white-space: pre-line; }

        .loading, .error { text-align: center; padding: 40px; color: #888; font-size: 16px; }
        
        /* 새로고침 안내 텍스트 */
        .pull-to-refresh-hint { text-align: center; font-size: 12px; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>

    <header>
        <h1>나이키 안산고잔 카탈로그</h1>
    </header>

    <!-- 신발, 의류, 기술 3개 탭만 배치 -->
    <div class="categories">
        <div class="cat-btn active" onclick="filterCategory('신발', this)">신발</div>
        <div class="cat-btn" onclick="filterCategory('의류', this)">의류</div>
        <div class="cat-btn" onclick="filterCategory('기술', this)">나이키 기술</div>
    </div>

    <div class="action-bar">
        <button class="action-btn" onclick="openModal()">➕ 새로운 정보 등록하기</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 품번 또는 상품명을 입력하세요" oninput="searchProducts()">
    </div>

    <div class="pull-to-refresh-hint">💡 화면을 맨 위로 올린 뒤 아래로 당기면 새로고침됩니다.</div>

    <div id="productContainer" class="product-list">
        <div class="loading">데이터를 불러오는 중입니다...</div>
    </div>

    <!-- 정보 등록 모달 창 -->
    <div id="formModal">
        <div class="modal-content">
            <h2>정보 신규 등록</h2>
            <form id="addItemForm" onsubmit="submitForm(event)">
                <div class="form-group">
                    <label>등록할 시트 선택</label>
                    <select id="targetSheet" onchange="toggleFormFields()">
                        <option value="시트1">상품 (신발/의류)</option>
                        <option value="나이키 기술">나이키 기술</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ID (고유번호)</label>
                    <input type="text" id="inputID" required placeholder="예: id123">
                </div>
                <div class="form-group" id="groupName">
                    <label>제품명</label>
                    <input type="text" id="inputName" placeholder="예: 나이키 에어포스">
                </div>
                <div class="form-group" id="groupTechName" style="display:none;">
                    <label>기술 이름</label>
                    <input type="text" id="inputTechName" placeholder="예: 줌 X 라이트">
                </div>
                <div class="form-group">
                    <label>카테고리</label>
                    <input type="text" id="inputCategory" placeholder="예: 신발 또는 의류">
                </div>
                <div class="form-group" id="groupCode">
                    <label>품번</label>
                    <input type="text" id="inputCode" placeholder="예: CJ9179-200">
                </div>
                <div class="form-group" id="groupPrice">
                    <label>가격 (숫자만)</label>
                    <input type="number" id="inputPrice" placeholder="예: 169000">
                </div>
                <div class="form-group" id="groupUsp">
                    <label>핵심 스펙 (USP)</label>
                    <textarea id="inputUsp" placeholder="스펙 입력"></textarea>
                </div>
                <div class="form-group" id="groupSales">
                    <label>세일즈 멘트</label>
                    <textarea id="inputSales" placeholder="세일즈 멘트 입력"></textarea>
                </div>
                <div class="form-group" id="groupDesc" style="display:none;">
                    <label>기술 설명</label>
                    <textarea id="inputDesc" placeholder="기술 설명 입력"></textarea>
                </div>
                <div class="form-group">
                    <label>사진 파일명 또는 URL</label>
                    <input type="text" id="inputPhoto" placeholder="예: 시트1_Images/1.png">
                </div>
                <div class="modal-btns">
                    <button type="submit" class="action-btn" style="background:#ff6600; color:#fff;">등록하기</button>
                    <button type="button" class="action-btn" style="background:#333; color:#aaa;" onclick="closeModal()">취소</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ★ 중요: 구글 Apps Script 웹 앱 URL 입력
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyN87RrfO4wwZ1M4Vov5ffF3LgoVB52MTwvemUQc0Ko1lJLSCudGkNc3cwcDbGE8zU/exec";

        let productList = [];
        let techList = [];
        let currentCategory = '신발'; // 기본 첫 화면은 '신발'로 설정

        async function loadSheetData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();
                productList = result.products || [];
                techList = result.techs || [];
                applyFilter();
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                document.getElementById('productContainer').innerHTML = '<div class="error">데이터를 불러오는 데 실패했습니다. URL을 확인해주세요.</div>';
            }
        }

        function displayData(items, type) {
            const container = document.getElementById('productContainer');
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="error">표시할 항목이 없습니다.</div>';
                return;
            }

            if (type === 'tech') {
                container.innerHTML = items.map(item => `
                    <div class="product-card">
                        <div class="product-title">${item['기술 이름'] || '기술명 없음'}</div>
                        <div class="product-code">분류: ${item['카테고리'] || '기술'} | ID: ${item['ID'] || '-'}</div>
                        
                        <div class="image-container">
                            ${item['기술사진'] ? `<img src="${item['기술사진']}" alt="${item['기술 이름']}" onerror="this.parentElement.innerHTML='이미지 로드 실패'">` : '사진 준비 중'}
                        </div>

                        <div class="section-title">기술 설명 및 가이드</div>
                        <div class="product-usp">${item['기술설명'] || '등록된 설명이 없습니다.'}</div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = items.map(item => `
                    <div class="product-card">
                        <div class="product-title">${item['제품명'] || '상품명 없음'}</div>
                        <div class="product-code">품번: ${item['품번'] || '-'} | 카테고리: ${item['카테고리'] || '-'}</div>
                        <div class="product-price">가격: ${item['가격'] ? Number(item['가격']).toLocaleString() + '원' : '가격 미정'}</div>
                        
                        <div class="image-container">
                            ${item['제품사진'] ? `<img src="${item['제품사진']}" alt="${item['제품명']}" onerror="this.parentElement.innerHTML='이미지 로드 실패'">` : '사진 준비 중'}
                        </div>

                        <div class="section-title">핵심 스펙 (USP)</div>
                        <div class="product-usp">${item['핵심스펙_USP'] || '등록된 스펙이 없습니다.'}</div>

                        <div class="section-title">세일즈 멘트</div>
                        <div class="product-sales">${item['세일즈멘트'] || '등록된 세일즈 멘트가 없습니다.'}</div>
                    </div>
                `).join('');
            }
        }

        function filterCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            applyFilter();
        }

        function searchProducts() {
            applyFilter();
        }

        function applyFilter() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            
            if (currentCategory === '기술') {
                const filtered = techList.filter(item => {
                    const name = String(item['기술 이름'] || '').toLowerCase();
                    const desc = String(item['기술설명'] || '').toLowerCase();
                    return name.includes(keyword) || desc.includes(keyword);
                });
                displayData(filtered, 'tech');
            } else {
                // 신발 또는 의류 필터링
                const filtered = productList.filter(item => {
                    const cat = String(item['카테고리'] || '').trim();
                    const name = String(item['제품명'] || '').toLowerCase();
                    const code = String(item['품번'] || '').toLowerCase();
                    
                    const matchesCat = (cat === currentCategory);
                    const matchesKeyword = (name.includes(keyword) || code.includes(keyword));
                    return matchesCat && matchesKeyword;
                });
                displayData(filtered, 'product');
            }
        }

        // 모달 열기/닫기 및 폼 토글
        function openModal() { document.getElementById('formModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('formModal').style.display = 'none'; }

        function toggleFormFields() {
            const target = document.getElementById('targetSheet').value;
            if (target === '나이키 기술') {
                document.getElementById('groupName').style.display = 'none';
                document.getElementById('groupTechName').style.display = 'block';
                document.getElementById('groupCode').style.display = 'none';
                document.getElementById('groupPrice').style.display = 'none';
                document.getElementById('groupUsp').style.display = 'none';
                document.getElementById('groupSales').style.display = 'none';
                document.getElementById('groupDesc').style.display = 'block';
            } else {
                document.getElementById('groupName').style.display = 'block';
                document.getElementById('groupTechName').style.display = 'none';
                document.getElementById('groupCode').style.display = 'block';
                document.getElementById('groupPrice').style.display = 'block';
                document.getElementById('groupUsp').style.display = 'block';
                document.getElementById('groupSales').style.display = 'block';
                document.getElementById('groupDesc').style.display = 'none';
            }
        }

        // 데이터 전송(업로드) 함수
        async function submitForm(event) {
            event.preventDefault();
            const targetSheet = document.getElementById('targetSheet').value;
            
            let postData = {
                targetSheet: targetSheet,
                ID: document.getElementById('inputID').value,
                카테고리: document.getElementById('inputCategory').value,
                관리자비밀번호: "6662",
            };

            if (targetSheet === '나이키 기술') {
                postData['기술 이름'] = document.getElementById('inputTechName').value;
                postData['기술설명'] = document.getElementById('inputDesc').value;
                postData['기술사진'] = document.getElementById('inputPhoto').value;
            } else {
                postData['제품명'] = document.getElementById('inputName').value;
                postData['품번'] = document.getElementById('inputCode').value;
                postData['가격'] = document.getElementById('inputPrice').value;
                postData['핵심스펙_USP'] = document.getElementById('inputUsp').value;
                postData['세일즈멘트'] = document.getElementById('inputSales').value;
                postData['제품사진'] = document.getElementById('inputPhoto').value;
            }

            alert("구글 시트에 데이터를 등록 중입니다...");

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(postData)
                });

                alert("등록이 완료되었습니다!");
                closeModal();
                document.getElementById('addItemForm').reset();
                loadSheetData();
            } catch (err) {
                console.error(err);
                alert("등록 중 오류가 발생했습니다.");
            }
        }

        // 모바일 위로 당겨서 새로고침 (Pull-to-Refresh) 기능 구현
        let touchstartY = 0;
        window.addEventListener('touchstart', e => {
            touchstartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', e => {
            let touchendY = e.changedTouches[0].clientY;
            // 화면 맨 위에서 아래로 100px 이상 쓸어내릴 때 새로고침 발동
            if (window.scrollY === 0 && (touchendY - touchstartY) > 100) {
                loadSheetData();
            }
        });

        window.onload = function() {
            loadSheetData();
        };
    </script>
</body>
</html>
